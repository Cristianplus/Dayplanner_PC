<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dayplanner/Editar</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="body">
        <div class="container">
            <h1 class="header">&nbsp;Agregar tarea</h1>
        </div>

        <div class="form-add-edit">
            <form class="add_task">

                <input type="text" name="titulo" placeholder="Agregar un título a tu tarea" class="title_task" required>

                <button id="btn_date">Seleccionar Fecha</button>

                <button id="btn_hour">Seleccionar Hora</button>

                <label for="fecha_hora" class="date_select">Fecha y hora:</label>

                <input type="checkbox" name="all_day" id="all_day">
                <label for="all_day" id="all_day_label">Todo el día</label>

                <input type="checkbox" name="repeat_task" id="repeat_task">
                <label for="repeat_task" id="repeat_task_label">Repetir tarea</label>

                <label for="frutas" id="color_label">Color:</label>
                <select name="color" id="color">
                <option>Seleccionar...</option>
                <option>🔴 Muy importante</option>
                <option>🟢 Importante</option>
                <option>🔵 No tan importante</option>
                </select>

                <input type="description" name="descripcion" placeholder="Descripción" id="description" required>

                <button class="add_btn"> Agregar tarea</button>

            </form>
            
        </div>
        
        <script src="js/app.js"></script>
    </body>

    </html>
